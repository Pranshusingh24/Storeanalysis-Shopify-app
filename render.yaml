# Render Blueprint Infrastructure-as-Code Configuration
# https://dashboard.render.com
# Storeanalysis by Pranshu Singh Baghel

services:
  - type: web
    name: storeanalysis
    env: node
    plan: starter # Note: Render requires Starter ($7/mo) when attaching a persistent disk for SQLite
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SHOPIFY_API_KEY
        value: 75d14d5d475920324080eb0fcb850342
      - key: SHOPIFY_API_SECRET
        sync: false # Provide your secret securely in Render Dashboard
      - key: SHOPIFY_APP_URL
        sync: false # e.g. https://storeanalysis.onrender.com
      - key: SCOPES
        value: read_all_orders,read_inventory,read_orders,read_products
      - key: DATABASE_URL
        value: "file:/data/production.sqlite"
      - key: SHOPIFY_BILLING_TEST
        value: "false" # Set to "true" while testing in developer store
      - key: SHOPIFY_APP_HANDLE
        value: "storeanalysis"
      - key: SHOPIFY_USE_MANAGED_PRICING
        value: "false" # Set to "true" once Shopify App Pricing hosted selection is opted-in
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
