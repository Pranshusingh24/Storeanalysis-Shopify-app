# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "storeanalysis"
handle = "storeanalysis"
application_url = "https://example.com"
embedded = true
client_id = "75d14d5d475920324080eb0fcb850342"

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[access_scopes]
# Scopes for analytics, orders, products, inventory read access
scopes = "read_orders,read_all_orders,read_products,read_inventory"

[auth]
redirect_urls = [
  "https://example.com/auth/callback",
  "https://example.com/auth/shopify/callback",
  "https://example.com/api/auth/callback"
]

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/updated"
  topics = [ "orders/updated" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/inventory_levels/update"
  topics = [ "inventory_levels/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "shop/redact" ]

[pos]
embedded = false
